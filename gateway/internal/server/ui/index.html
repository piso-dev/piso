            (data.provider?.providers || []).find((x) => x.id === id) || {};
          return confirmAction(
            "Delete provider?",
            "Remove " +
              (p.name || id) +
              " from the shared pi profile. Running sessions keep their current model until they reload.",
            "Delete",
            async () => {
              await api("pi-provider/delete", "POST", { id });
              await changed(["provider", "modelOverrides"]);
            },
          );
        }
        if (
          ["rule-add", "pattern-add", "exception-add", "domain-add"].includes(
            name,
          )
        )
          return addPolicy(name.split("-")[0]);
        if (name === "route-add") return routeForm();
        if (name === "resolve") return resolveBlock(id);
        if (name === "block-secret") return blockSecret(id);
        if (name === "block-allow") {
          const r =
              list("requests").find((r) => r.id === id) ||
              frozenRequests.find((r) => r.id === id),
            p = r.findings.find((f) => f.kind === "pattern");
          return confirmAction(
            "Allow this pattern on this host?",
            "Allows " +
              p.patternId +
              " on " +
              r.host +
              " and replays matching captured requests. Other patterns and real-secret blocks remain enforced.",
            "Allow and replay",
            async () => {
              const out = await api(
                "failures/except",
                "POST",
                { host: r.host, patternId: p.patternId },
                120000,
              );
              await changed(["requests", "exceptions"]);
              setTimeout(() => showReplay(out), 0);
            },
          );
        }
        if (name === "publish") return publishPlan(id);
        if (name === "dismiss") {
          await api("ingress/requests/" + enc(id) + "/dismiss", "POST");
          return changed(["plans"]);
        }
        if (name.startsWith("ask-")) return decideAsk(name.slice(4), id);
        if (name === "mcp-auth") return authorizeMCP(id);
        if (name === "mcp-revoke")
          return confirmAction(
            "Revoke MCP access?",
            "The worker will need authorization again before using this server.",
            "Revoke access",
            async () => {
              await api("mcp/" + enc(id) + "/revoke", "POST", {});
              await changed(["mcp", "mcpPending"]);
            },
          );
        if (name === "github-connect") return githubConnect(id);
        if (name === "github-create-group") return githubConnect("", id);
        if (name === "github-import") return githubImportForm(id);
        if (name === "github-reconnect") {
          const app = list("github").find((app) => app.id === id);
          if (!app) throw new Error("App not found; refresh the page.");
          return githubImportForm(app.secretId, app);
        }
        if (name === "github-install") return githubInstall(id);
        if (name === "github-refresh") {
          await api("github-app/" + enc(id) + "/refresh", "POST", {});
          return changed(["github", "githubPending", "connections"]);
        }
        if (name === "github-remove")
          return confirmAction(
            "Remove GitHub App from gateway?",
            "This removes all routes for this app from the gateway, including every account installation. Other apps in the access group are unchanged. It does not delete the app on GitHub.",
            "Remove app",
            async () => {
              await api("github-app/" + enc(id), "DELETE");
              await changed(["github", "githubPending", "connections"]);
            },
          );
        if (name === "directive-toggle") {
          const d = list("directives").find((d) => d.id === id);
          if (!d) throw new Error("Directive not found; refresh the page.");
          const paused = d.status === "paused";
          return confirmAction(
            paused ? "Resume " + d.code + "?" : "Pause " + d.code + "?",
            paused
              ? "Workers read it again at their next session start. Tasks already running are unchanged."
              : "Workers stop reading it at their next session start. Nothing is deleted, and the code stays reserved for this directive.",
            paused ? "Resume directive" : "Pause directive",
            async () => {
              await api("directives/" + enc(id), "PUT", {
                status: paused ? "active" : "paused",
              });
              await changed(["directives"]);
            },
          );
        }
        if (name === "directive-delete") {
          const d = list("directives").find((d) => d.id === id);
          if (!d) throw new Error("Directive not found; refresh the page.");
          return confirmAction(
            "Delete " + d.code + "?",
            "Workers stop seeing “" +
              d.title +
              "”. The code " +
              d.code +
              " is never reused, so any handoff that cites it stays traceable. Pausing keeps the text if you only want a break.",
            "Delete directive",
            async () => {
              await api("directives/" + enc(id), "DELETE");
              await changed(["directives"]);
            },
          );
        }
        if (name === "route-open") {
          const r = list("routes").find((r) => r.id === id);
          return openExternal(routeURL(r.name));
        }
        if (name === "route-toggle") {
          const r = list("routes").find((r) => r.id === id);
          return confirmAction(
            r.disabled ? "Enable this service?" : "Disable this service?",
            r.name +
              " will " +
              (r.disabled ? "be reachable" : "stop being reachable") +
              " through the gateway.",
            r.disabled ? "Enable service" : "Disable service",
            async () => {
              await api("routes/" + enc(id) + "/disabled", "POST", {
                disabled: !r.disabled,
              });
              await changed(["routes"]);
            },
          );
        }
        if (name === "worker-toggle") {
          const w = list("workers").find((w) => w.name === id);
          return confirmAction(
            w.internetDisabled
              ? "Enable worker internet?"
              : "Disable worker internet?",
            id +
              (w.internetDisabled
                ? " can send requests through the gateway again. All policy checks still apply."
                : " will lose all outbound network access, including model and tool requests."),
            w.internetDisabled ? "Enable internet" : "Disable internet",
            async () => {
              await api("workers/" + enc(id) + "/internet", "POST", {
                disabled: !w.internetDisabled,
              });
              await changed(["workers"]);
            },
          );
        }
        if (name.startsWith("delete-")) {
          const key = name.slice(7);
          return confirmAction(
            "Delete " + key.replace(/s$/, "") + "?",
            "Remove " + id + ". This cannot be undone.",
            "Delete",
            async () => {
              await api(key + "/" + enc(id), "DELETE");
              await changed(
                key === "secrets" ? ["secrets", "rules", "provider"] : [key],
              );
            },
          );
        }
      }
      document.addEventListener("click", async (e) => {
        const b = e.target.closest("button[data-action]");
        if (!b || b.disabled) return;
        b.disabled = true;
        try {
          await action(b.dataset.action, b.dataset.id, b);
        } catch (error) {
          errorDialog(error);
        } finally {
          if (b.isConnected) b.disabled = false;
        }
      });
      $(".skip").addEventListener("click", (e) => {
        e.preventDefault();
        $("#main").focus();
      });
      window.addEventListener("hashchange", navigate);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopLiveClock();
          // A hidden tab is not a person reading the task. Staying silent also
          // means the browser cannot throttle a beat into a false hold.
          stopViewBeat();
        } else if (view === "live") renderLive();
        else if (view === "tasks") syncViewBeat();
      });
      let streamTimer;
      function stream() {
        const es = new EventSource("/api/v1/requests/stream");
        es.onopen = () => {
          streamOK = true;
          renderGlobal();
        };
        es.onerror = () => {
          streamOK = false;
          renderGlobal();
        };
        const schedule = () => {
          clearTimeout(streamTimer);
          streamTimer = setTimeout(
            () => refresh(["activities", "workers"]),
            400,
          );
        };
        es.addEventListener("record", (e) => {
          try {
            const r = JSON.parse(e.data);
            if (!r.id) return;
            data.requests = [
              r,
              ...list("requests").filter((x) => x.id !== r.id),
            ].slice(0, 300);
            loaded.add("requests");
            renderGlobal();
            if (view === "traffic" && !paused) renderTraffic();
          } catch {}
        });
        es.addEventListener("activity", schedule);
        const updates = {
          planning: ["plans"],
          asks: ["asks"],
          route: ["routes", "workers"],
          mcp: ["mcp", "mcpPending"],
          github: ["github", "githubUser", "githubMappings", "githubPending", "connections"],
        };
        Object.entries(updates).forEach(([event, keys]) =>
          es.addEventListener(event, () => refresh(keys)),
        );
      }
      navigate();
      (async () => {
        await health();
        await refresh();
        stream();
        setInterval(() => {
          if (!document.hidden) {
            if (view === "tasks" && !taskUI.loading) loadTasks();
            health();
            refresh([
              "workers",
              "activities",
              "asks",
              "plans",
              "mcp",
              "mcpPending",
              "github",
              "githubMappings",
              "githubUser",
              "githubPending",
              "connections",
              "aiBoost",
              "routes",
              "technocore",
              ...(!streamOK ? ["requests"] : []),
            ]);
          }
        }, 10000);
      })();
    </script>
    <script>
      // Dashboard sign-out. Only shown when this gateway actually requires a
      // login; a local gateway never asks, so the button stays out of the way.
      (async () => {
        let st;
        try {
          const res = await fetch('/auth/session', { credentials: 'same-origin' });
          if (!res.ok) return;
          st = await res.json();
        } catch (e) {
          return;
        }
        if (!st || !st.required || !st.authenticated) return;
        const b = document.createElement('button');
        b.textContent = 'Sign out';
        b.title = st.kind ? 'signed in with ' + st.kind : 'sign out';
        b.style.cssText = 'position:fixed;right:14px;bottom:12px;z-index:9999;' +
          'padding:7px 12px;border-radius:8px;border:1px solid #2c3742;' +
          'background:#11161dcc;color:#9aa7b4;font:12px/1.2 ui-sans-serif,system-ui,sans-serif;' +
          'cursor:pointer;opacity:.55;transition:opacity .15s';
        b.onmouseenter = () => { b.style.opacity = '1'; };
        b.onmouseleave = () => { b.style.opacity = '.55'; };
        b.onclick = async () => {
          b.disabled = true;
          b.textContent = 'Signing out…';
          try { await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          location.reload();
        };
        document.body.appendChild(b);
      })();
    </script>
  </body>
</html>
