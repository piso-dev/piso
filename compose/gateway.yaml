# piso gateway compose — the shared, one-per-machine service.
# Project name "piso" ⇒ networks/containers are piso_vpc / piso_gateway.
# The worker compose (generated per-project by `piso up`) joins piso_vpc as an
# external network, so the gateway is the ONLY member with egress.
#
# Load-bearing: piso_vpc is an *internal* network. Docker drops any packet
# forwarded off that bridge, so the worker has no path to the internet except
# the gateway (which is also on the egress network). Masquerade-off is extra.
# Compose will not flip Internal on an already-created piso_vpc — `piso up`
# tears it down and recreates it when the existing one is leaky.
name: piso

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: piso-gateway
    restart: unless-stopped
    ports:
      # Host ports are set by `piso up --*-port` (PISO_*_PORT). In-container
      # listen ports stay 8080/8081/8082/8083 so the worker proxy env does not change.
      # :8083 is the worker API and is not published to the host.
      #
      # Colocated with the coordinator's Caddy: Caddy owns host 80/443, so
      # `piso up --ctrl-port 8091 --ingress-port 8092` keeps these loopback
      # publishes out of the way. Caddy reaches the dashboard over piso_public
      # (piso-gateway:8081), not through these ports. On the coordinator host
      # prefer `piso setup --rebuild`: `piso up` also creates a project worker,
      # and a worker must not share a host with the standalone gateway's vault.
      #
      # Bind both 127.0.0.1 and ::1: /etc/hosts maps piso.local to both (macOS
      # .local is mDNS; without ::1, IPv6 lookups hang). IPv4-only publish
      # leaves ::1:80 dead, so browsers stall and the dashboard looks empty.
      - "127.0.0.1:${PISO_PROXY_PORT:-8080}:8080"
      - "[::1]:${PISO_PROXY_PORT:-8080}:8080"
      - "127.0.0.1:${PISO_CTRL_PORT:-80}:8081"
      - "[::1]:${PISO_CTRL_PORT:-80}:8081"
      - "127.0.0.1:${PISO_INGRESS_PORT:-8082}:8082"
      - "[::1]:${PISO_INGRESS_PORT:-8082}:8082"
      # Remote-worker TLS mux. Loopback unless the gateway has --url (then 0.0.0.0).
      - "${PISO_PUBLIC_BIND:-127.0.0.1}:${PISO_PUBLIC_PORT:-8443}:8443"
    volumes:
      # Machine-level state (secrets, CA, log). The CLI sets PISO_DATA
      # (default ~/.piso) so an installed binary does not need a writable repo.
      # Quoted so Windows `C:/Users/...` survives YAML.
      - "${PISO_DATA}:/data"
    environment:
      PISO_STATE_FILE: /data/state.json
      PISO_PATTERNS_FILE: /data/patterns.json
      PISO_LOG_FILE: /data/requests.jsonl
      PISO_ACTIVITIES_FILE: /data/activities.db
      PISO_CA_CERT: /data/ca.crt
      PISO_CA_KEY: /data/ca.key
      PISO_PROXY_LISTEN: :8080
      PISO_CTRL_LISTEN: :8081
      PISO_WORKER_LISTEN: :8083
      PISO_PUBLIC_LISTEN: :8443
      PISO_INGRESS_LISTEN: :8082
      # The public WEB port (same listener as the control plane — WebHandler
      # dispatches dashboard vs ingress by Host on one port), advertised on
      # /api/v1/health so URL generators are portless. Defaults to the control
      # publish port: http://piso.local (dashboard) and http://<label>.piso.local
      # (worker routes) both resolve with NO port.
      # `piso up` exports PISO_WEB_PORT from the dashboard host port; set it to
      # 80 when a TLS front proxy (Caddy) serves this gateway on 443, so
      # generated URLs stay portless behind https://gateway.example.com.
      PISO_INGRESS_PORT: ${PISO_WEB_PORT:-80}
      # piso_public subnet, pinned by `ipam` below. A TLS front proxy on that
      # bridge (the coordinator host's Caddy) sits on a non-default interface,
      # so the gateway would classify it as a worker and 403 the dashboard.
      # Defaults to the pinned subnet so a colocated deploy needs no extra
      # config; override only if you change PISO_PUBLIC_SUBNET.
      PISO_TRUSTED_PEER_CIDRS: ${PISO_TRUSTED_PEER_CIDRS:-172.30.99.0/24}
    networks:
      - vpc
      - egress
      # Optional: shared bridge with the coordinator's Caddy. Created by
      # `docker network create piso_public`; only its Caddy and this gateway
      # join it, so the gateway stays unreachable from the worker bridge.
      - public

  # Project manager: a special worker that reads activity and decides pokes/
  # reminders. Host-scoped (watches all projects), so it lives with the
  # gateway — same lifecycle, same sandboxing (internal vpc, cap_drop,
  # no project mount, read-only rootfs). Its slug is "monitor". The worker
  # API treats it as the project-manager lens for GET /activities (full
  # board); everything else is an ordinary sandboxed worker whose LLM key
  # is a scoped secret (Workers: [monitor]).
  #
  # Behind a profile so a host can leave it out. It is a WORKER: on a
  # standalone gateway colocated with the coordinator, a worker must not share
  # the host with the vault, so that deploy runs with PISO_MONITOR=0 (see
  # docs/technocore-setup.md). The CLI passes COMPOSE_PROFILES from
  # ~/.piso/host.json on every compose call; naming the service explicitly
  # (`docker compose up monitor`) still starts it, which is what
  # `piso update` relies on.
  monitor:
    profiles: ["monitor"]
    image: piso-worker
    container_name: piso-worker-monitor
    restart: unless-stopped
    stdin_open: true
    tty: true
    # The PM wake loop (pi reads the feed per MONITOR.md, emits pokes). The
    # entrypoint launches the infra watchers first, then exec's this.
    command: /usr/local/bin/piso-monitor-loop
    volumes:
      - piso-agent-monitor:/root/.pi/agent   # own session volume; NO project mount
      - "${PISO_DATA}/ca.crt:/piso-ca.pem:ro"
      - "${PISO_DATA}/pi-profile:/opt/piso/pi-profile:ro"
      - "${PISO_DATA}/workers/monitor:/etc/piso:ro"   # dir mount: env rewrites are visible live (atomic rename swaps the inode)
    environment:
      HTTPS_PROXY: http://127.0.0.1:18080
      HTTP_PROXY: http://127.0.0.1:18080
      ALL_PROXY: http://127.0.0.1:18080
      https_proxy: http://127.0.0.1:18080
      http_proxy: http://127.0.0.1:18080
      all_proxy: http://127.0.0.1:18080
      PISO_EGRESS_UPSTREAM: gateway:8080
      NO_PROXY: gateway,localhost,127.0.0.1,*.piso.local
      no_proxy: gateway,localhost,127.0.0.1,*.piso.local
      SSL_CERT_FILE: /piso-ca.pem
      CURL_CA_BUNDLE: /piso-ca.pem
      GIT_SSL_CAINFO: /piso-ca.pem
      REQUESTS_CA_BUNDLE: /piso-ca.pem
      NODE_EXTRA_CA_CERTS: /piso-ca.pem
      GATEWAY_URL: http://gateway:8083
      PISO_WORKER_NAME: piso-worker-monitor
      PISO_WORKER_SLUG: monitor
      PISO_ROLE: monitor
      NPM_CONFIG_CACHE: /root/.pi/agent/.npm-cache
      TMPDIR: /root/.pi/agent/tmp
      NODE_COMPILE_CACHE: /root/.pi/agent/.node-compile-cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /root/.cache
      - /root/.npm
    networks:
      - vpc

networks:
  vpc:
    name: piso_vpc
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  egress:
    name: piso_egress
    driver: bridge
  public:
    # Owned by this project and pinned by name so the coordinator's Caddy can
    # join it as external. A laptop install creates it with `piso up` and
    # ignores the extra network (`piso_public` has no members there).
    # Never attach Caddy to piso_vpc — the gateway rejects control-plane peers
    # on the worker bridge.
    #
    # The subnet is pinned so the gateway can trust the front proxy by IP
    # (PISO_TRUSTED_PEER_CIDRS, above). Change both together, or not at all.
    name: piso_public
    driver: bridge
    ipam:
      config:
        - subnet: ${PISO_PUBLIC_SUBNET:-172.30.99.0/24}

volumes:
  piso-agent-monitor:
    name: piso-agent-monitor